services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    depends_on:
      - readability-service
      - gotenberg
      - epub-service
      - seaweedfs
    restart: unless-stopped

  readability-service:
    build:
      context: ./readability-service
      dockerfile: Dockerfile
    env_file:
      - ./readability-service/.env
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.36.0-chromium
    restart: unless-stopped

  epub-service:
    build:
      context: ./epub-service
      dockerfile: Dockerfile
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    ports:
      - "8333:8333"
    env_file:
      - ./server/.env
    volumes:
      - seaweed-data:/data

volumes:
  seaweed-data:
