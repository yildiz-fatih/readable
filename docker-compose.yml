services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    env_file:
      - ./server/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      readability-service:
        condition: service_started
      gotenberg:
        condition: service_started
      epub-service:
        condition: service_started
      seaweedfs:
        condition: service_started
    restart: unless-stopped

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile.migrate
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy

  readability-service:
    build:
      context: ./readability-service
      dockerfile: Dockerfile
    env_file:
      - ./readability-service/.env
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.36.0-chromium
    restart: unless-stopped

  epub-service:
    build:
      context: ./epub-service
      dockerfile: Dockerfile
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    ports:
      - "8333:8333"
    env_file:
      - ./server/.env
    volumes:
      - seaweed-data:/data

  postgres:
    image: postgres:18.6-alpine3.24
    ports:
      - "5432:5432"
    env_file:
      - ./server/.env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  seaweed-data:
  postgres-data:
