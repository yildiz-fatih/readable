services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      API_PORT: ${API_PORT}
      POSTGRES_URL: ${POSTGRES_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      READABILITY_SERVICE_URL: ${READABILITY_SERVICE_URL}
      GOTENBERG_URL: ${GOTENBERG_URL}
      EPUB_SERVICE_URL: ${EPUB_SERVICE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_INTERNAL_URL: ${S3_INTERNAL_URL}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      readability-service:
        condition: service_started
      gotenberg:
        condition: service_started
      epub-service:
        condition: service_started
      seaweedfs:
        condition: service_started
    restart: unless-stopped

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile.migrate
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
    depends_on:
      postgres:
        condition: service_healthy

  readability-service:
    build:
      context: ./readability-service
      dockerfile: Dockerfile
    environment:
      READABILITY_SERVICE_PORT: ${READABILITY_SERVICE_PORT}
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.36.0-chromium
    restart: unless-stopped

  epub-service:
    build:
      context: ./epub-service
      dockerfile: Dockerfile
    environment:
      EPUB_SERVICE_PORT: ${EPUB_SERVICE_PORT}
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - seaweed-data:/data

  postgres:
    image: postgres:18.6-alpine3.24
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  seaweed-data:
  postgres-data:
