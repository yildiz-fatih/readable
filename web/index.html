<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <main class="container">
        <h1 id="readable-title">Readable</h1>

        <form id="readable-form">
            <div class="field">
                <label for="url" class="section-title">URL</label><br />
                <input type="url" id="url" name="url" placeholder="https://example.com/article" required>
            </div>

            <fieldset>
                <legend class="section-title">Format</legend>

                <label class="format-option">
                    <input type="radio" name="format" value="pdf" checked />
                    PDF
                </label>

                <label class="format-option">
                    <input type="radio" name="format" value="epub" />
                    EPUB
                </label>

                <label class="format-option">
                    <input type="radio" name="format" value="md" />
                    MD
                </label>

                <label class="format-option">
                    <input type="radio" name="format" value="html" />
                    HTML
                </label>
            </fieldset>

            <button type="submit" id="submit-button">Go</button>
        </form>

        <br>
        <div id="status-card"></div>
    </main>
</body>

</html>
